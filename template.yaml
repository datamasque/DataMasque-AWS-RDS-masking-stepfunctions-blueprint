AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Runtime: python3.12
    Environment:
      Variables:
        # boto3 adaptive retries so RDS API throttling during polling loops is
        # retried rather than failing the workflow and orphaning the staging clone.
        AWS_RETRY_MODE: adaptive
        AWS_MAX_ATTEMPTS: '10'
        # Stamps the PRM identifier onto the User-Agent of every AWS API call the
        # Lambdas make, so calls are attributed even on resources that cannot be tagged.
        #
        # The bare product code, not the 'pc:<code>' tag form: botocore sanitises
        # this value to RFC 9110 token characters and rewrites ':' to '-', so
        # 'pc:<code>' would be emitted as 'app/pc-<code>' and match nothing. The
        # bare code survives sanitisation unchanged.
        AWS_SDK_UA_APP_ID: !Select [1, !Split [":", !Ref PRMTagValue]]
    Tags:
      aws-apn-id: !Ref PRMTagValue

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID where the lambdas will be deployed.
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: List of SUbnet IDs where the lambdas will be deployed.
  DatamasqueBaseUrl:
    Type: String
    Description: DATAMASQUE instance URL.
  DatamasqueSecretArn:
    Type: String
    Description: AWS secret for DATAMASQUE instance credentials.
  DataMasqueSecurityGroup:
    Type: String
    Description: Security Group ID for connectivity between Staged DB and DM instance.
  DatamasqueVerifyTls:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: >
      Whether the Lambdas verify the DataMasque API TLS certificate. Defaults to
      'true'. Set to 'false' only for a documented self-signed / private-CA
      DataMasque instance on a trusted network path (removes MITM protection for
      traffic carrying credentials and run secrets).
  AllowedRunSecretArnPattern:
    Type: String
    Default: 'datamasque/*run-secret*'
    Description: >
      Secret-name pattern (the part after 'secret:' in the ARN) that the
      DatamasqueRun Lambda is permitted to read for the AwsSecretArn input
      field. Defaults to 'datamasque/*run-secret*' in the deploying account
      and region. Use '*' to permit any secret in the account (not
      recommended). Cross-account access also requires a resource policy
      on the source secret.
  PRMTagValue:
    Type: String
    Default: 'pc:dp9c56sw1n8t10q5s4pxlgl3x'
    AllowedPattern: '^pc:[A-Za-z0-9]+$'
    ConstraintDescription: >
      Must be the PRM tag form 'pc:<marketplace-product-code>'. The product code
      after the colon is also used on its own as the User-Agent app id.
    Description: >
      AWS Partner Revenue Measurement (PRM) attribution tag value, in the form
      'pc:<marketplace-product-code>'. Applied as the 'aws-apn-id' tag to the
      resources this stack provisions, to the staging database, and to the masked
      snapshot at the point each is created. Defaults to the DataMasque product
      code.

Resources:
  DatamasqueRunSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: DATAMASQUE blueprint API run Lambda security group
      VpcId:
        Ref: VpcId
      Tags:
        - Key: aws-apn-id
          Value: !Ref PRMTagValue

  DatamasqueRun:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/datamasque_run/
      Handler: app.lambda_handler
      Timeout: 60
      Architectures:
        - x86_64
      Policies:
        - VPCAccessPolicy: {}
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref DatamasqueSecretArn
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:datamasque/*connections*"
        - Statement:
            - Sid: ReadUserSuppliedRunSecret
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AllowedRunSecretArnPattern}*'
      VpcConfig:
        SubnetIds:
          Ref: SubnetIds
        SecurityGroupIds:
          - Ref: DatamasqueRunSg
      Environment:
        Variables:
          DATAMASQUE_BASE_URL: !Ref DatamasqueBaseUrl
          DATAMASQUE_SECRET_ARN: !Ref DatamasqueSecretArn
          DATAMASQUE_VERIFY_TLS: !Ref DatamasqueVerifyTls

  DescribeDBInstances:
    Type: AWS::Serverless::Function # More info about Function Resource: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-function.html
    Properties:
      CodeUri: functions/describe_db_instances/
      Handler: app.lambda_handler
      Timeout: 10
      Architectures:
        - x86_64
      Policies:
        - AmazonRDSReadOnlyAccess

  DescribeDBSnapshot:
    Type: AWS::Serverless::Function # More info about Function Resource: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-function.html
    Properties:
      CodeUri: functions/describe_db_snapshots/
      Handler: app.lambda_handler
      Timeout: 10
      Architectures:
        - x86_64
      Policies:
        - AmazonRDSReadOnlyAccess
        - Statement:
            - Action:
                - rds:CreateDBSnapshot
                - rds:CreateDBClusterSnapshot
                - rds:AddTagsToResource
              Effect: Allow
              Resource: "*"

  RestoreDBInstanceFromSnapshot:
    Type: AWS::Serverless::Function # More info about Function Resource: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-function.html
    Properties:
      CodeUri: functions/restore_db_instance_from_db_snapshot/
      Handler: app.lambda_handler
      Timeout: 10
      Environment:
        Variables:
          DATAMASQUE_SG: !Ref DataMasqueSecurityGroup
          PRM_TAG_VALUE: !Ref PRMTagValue
      Architectures:
        - x86_64
      Policies:
        - AmazonRDSReadOnlyAccess
        - Statement:
            - Action:
                - iam:PassRole
                - rds:AddTagsToResource
                - rds:RestoreDBInstanceFromDBSnapshot
                - rds:RestoreDBClusterFromSnapshot
              Effect: Allow
              Resource: "*"

  CheckDBAvailability:
    Type: AWS::Serverless::Function # More info about Function Resource: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-function.html
    Properties:
      CodeUri: functions/check_db_availability/
      Handler: app.lambda_handler
      Timeout: 10
      Architectures:
        - x86_64
      Environment:
        Variables:
          PRM_TAG_VALUE: !Ref PRMTagValue
      Policies:
        - AmazonRDSReadOnlyAccess
        - Statement:
            - Action:
                - rds:AddTagsToResource
              Effect: Allow
              Resource: "*"
            - Action:
                - rds:CreateDBInstance
              Effect: Allow
              Resource: "*"

  CreateMaskedSnapshot:
    Type: AWS::Serverless::Function # More info about Function Resource: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-function.html
    Properties:
      CodeUri: functions/create_masked_snapshot/
      Handler: app.lambda_handler
      Timeout: 60
      Architectures:
        - x86_64
      Environment:
        Variables:
          PRM_TAG_VALUE: !Ref PRMTagValue
      Policies:
        - AmazonRDSReadOnlyAccess
        - Statement:
            - Action:
                - rds:CreateDBSnapshot
                - rds:CreateDBClusterSnapshot
              Effect: Allow
              Resource: "*"
            # Tagging on create is authorised against the snapshot being created,
            # whose identifier this Lambda builds as '<staging-db>-masked-<stamp>'.
            - Action:
                - rds:AddTagsToResource
              Effect: Allow
              Resource:
                - !Sub "arn:aws:rds:${AWS::Region}:${AWS::AccountId}:snapshot:*-masked-*"
                - !Sub "arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster-snapshot:*-masked-*"

  CheckMaskedSnapshot:
    Type: AWS::Serverless::Function # More info about Function Resource: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-function.html
    Properties:
      CodeUri: functions/check_masked_snapshot/
      Handler: app.lambda_handler
      Timeout: 60
      Architectures:
        - x86_64
      Policies:
        - AmazonRDSReadOnlyAccess

  CheckMaskingRunStatus:
    Type: AWS::Serverless::Function # More info about Function Resource: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-function.html
    Properties:
      CodeUri: functions/check_masking_run/
      Handler: app.lambda_handler
      Timeout: 20
      Architectures:
        - x86_64
      Policies:
        - VPCAccessPolicy: {}
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref DatamasqueSecretArn
      VpcConfig:
        SubnetIds:
          Ref: SubnetIds
        SecurityGroupIds:
          - Ref: DatamasqueRunSg
      Environment:
        Variables:
          DATAMASQUE_BASE_URL: !Ref DatamasqueBaseUrl
          DATAMASQUE_SECRET_ARN: !Ref DatamasqueSecretArn
          DATAMASQUE_VERIFY_TLS: !Ref DatamasqueVerifyTls

  DatamasqueBlueprintStateMachine:
    Type: AWS::Serverless::StateMachine # More info about State Machine Resource: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-statemachine.html
    Properties:
      Tags:
        aws-apn-id: !Ref PRMTagValue
      DefinitionUri: statemachine/datamasque_blueprint.asl.json
      DefinitionSubstitutions:
        DatamasqueRunFunctionArn: !GetAtt DatamasqueRun.Arn
        DescribeDBSnapshotFunctionArn: !GetAtt DescribeDBSnapshot.Arn
        DescribeDBInstancesFunctionArn: !GetAtt DescribeDBInstances.Arn
        RestoreDBInstanceFromSnapshotFunctionArn: !GetAtt RestoreDBInstanceFromSnapshot.Arn
        CheckDBAvailabilityArn: !GetAtt CheckDBAvailability.Arn
        CheckMaskingRunStatus: !GetAtt CheckMaskingRunStatus.Arn
        CreateMaskedSnapshot: !GetAtt CreateMaskedSnapshot.Arn
        CheckMaskedSnapshot: !GetAtt CheckMaskedSnapshot.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref DescribeDBInstances
        - LambdaInvokePolicy:
            FunctionName: !Ref DescribeDBSnapshot
        - LambdaInvokePolicy:
            FunctionName: !Ref RestoreDBInstanceFromSnapshot
        - LambdaInvokePolicy:
            FunctionName: !Ref DatamasqueRun
        - LambdaInvokePolicy:
            FunctionName: !Ref CheckDBAvailability
        - LambdaInvokePolicy:
            FunctionName: !Ref CheckMaskingRunStatus
        - LambdaInvokePolicy:
            FunctionName: !Ref CreateMaskedSnapshot
        - LambdaInvokePolicy:
            FunctionName: !Ref CheckMaskedSnapshot
        - Statement:
            - Action:
                - rds:DeleteDBInstance
              Effect: Allow
              Resource:
                - !Sub "arn:aws:rds:${AWS::Region}:${AWS::AccountId}:db:*-datamasque"
                - !Sub "arn:aws:rds:${AWS::Region}:${AWS::AccountId}:db:*-datamasque-1"
            - Action:
                - rds:DeleteDBCluster
              Effect: Allow
              Resource: !Sub "arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster:*-datamasque"
            - Action:
                - rds:CreateDBSnapshot
                - rds:CreateDBClusterSnapshot
              Effect: Allow
              Resource: "*"
      Events:
        Schedule:
          Type: Schedule # More info about Schedule Event Source: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-property-statemachine-schedule.html
          Properties:
            Description: Schedule to run the DATAMASQUE state machine weekly
            Enabled: False
            Schedule: "rate(7 days)"
            Input: !Sub '{
              "DBInstanceIdentifier": "demo-oracle-datamasque-03-rds",
              "DBSecretIdentifier": "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:datamasque/demo/oracle_connections-TpvoiO",
              "DataMasqueRulesetId": "4f115c49-43bb-4cbc-a5b8-55a5aa9509e0",
              "PreferredAZ": "ap-southeast-2b"
              }'
